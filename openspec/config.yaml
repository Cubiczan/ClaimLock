schema: spec-driven

context: |
  ClaimLock (Cubiczan) — propose → challenge → human-lock claims with Solana
  attestation for Colosseum Crypto World's Fair. Cubiczan CHP / ServiceSell×FinBridge
  is prior art; this repo focuses the crypto-native Solana wedge. Devnet only.
  Brand: Cubiczan (never CubicZan). No invented mainnet traction or fake customers.
  Native Solana program (not Anchor) with one instruction: attest_claim_hash.
  Never commit private key JSON.

